name: handmade
description: Fail pull requests that bring back AI-default design or drift from your design system.
branding:
  icon: pen-tool
  color: green
inputs:
  path:
    description: Folder to check
    default: "."
  min-score:
    description: Minimum AI-default score (0 to 100)
    default: "85"
  ignore:
    description: Comma-separated tell IDs or categories to skip
    default: ""
  enforce:
    description: Fail the job when the check fails ("true" or "false")
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: |
        args=(check "${{ inputs.path }}" --format github --min-score "${{ inputs.min-score }}")
        [ -n "${{ inputs.ignore }}" ] && args+=(--ignore "${{ inputs.ignore }}")
        if [ "${{ inputs.enforce }}" = "true" ]; then handmade "${args[@]}"; else handmade "${args[@]}" || true; fi

name: release

# Push a tag like v0.1.0 to publish:
# - the package to PyPI (pip install handmade, pipx, uvx)
# - handmade.pyz, a single file that runs with plain Python, to the GitHub release
#
# One-time setup on PyPI: add this repository as a "trusted publisher" for the project
# (workflow: release.yml, environment: pypi). No API token is needed.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        # scripts/bump_version.py sets every version at once; this stops a tag from shipping stale metadata.
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: python -m unittest discover -s tests
      - run: pip install build && python -m build
      - run: python -m zipapp src -m "handmade.cli:main" -p "/usr/bin/env python3" -o dist/handmade.pyz
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: rm dist/handmade.pyz
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - name: Move the major tag, so workflows can pin h-hiram/handmade@v0
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "$major"

  mcp-registry:
    # Lists the MCP server in the official MCP Registry once the PyPI upload is live.
    # Needs no secret: the registry trusts GitHub's OIDC token for io.github.h-hiram/* names.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retries while PyPI makes the new version visible)
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
